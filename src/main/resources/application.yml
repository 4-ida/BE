server:
  port: 8080

spring:
  application:
    name: pillmate

  datasource:
    url: jdbc:mysql://localhost:3306/pillmate_db?allowPublicKeyRetrieval=true&sslMode=DISABLED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: pillmate_user
    password: pillmate123

    hikari:
      max-lifetime: 400000
      idle-timeout: 600000
      connection-timeout: 30000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update # 초기 개발은 create/update 중 택1
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate.format_sql: true

  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# 로깅 레벨 설정: SQL을 더 자세히 보고 싶을 때 사용
logging:
  level:
    org.hibernate.SQL: debug # 실행되는 SQL 쿼리를 보여줌 (show-sql: true와 유사)
    org.hibernate.type: trace # SQL에 바인딩되는 파라미터 값을 보여줌 (매우 유용!)
    org.springframework.jdbc: debug

# Swagger(OpenAPI) 설정
springdoc:
  swagger-ui:
    path: /swagger.html
    try-it-out-enabled: true
  api-docs:
    path: /api-docs
