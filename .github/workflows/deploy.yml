name: Deploy to Production

on:
  push:
    branches:
      - develop # develop 브랜치에 push될 때 실행
  workflow_dispatch: # 수동 실행 가능

env:
  DOCKER_IMAGE: kimjuhui/spring-app
  DOCKER_TAG: latest

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy to Server
    runs-on: self-hosted  # Self-hosted runner 사용
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: |
          echo "Pulling latest Docker image..."
          docker pull ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Stop and remove old container
        run: |
          echo "Stopping and removing old container..."
          docker stop spring-app || true
          docker rm spring-app || true

      - name: Deploy with docker-compose or docker run
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY }}
        run: |
          # docker-compose가 있는 경우 사용, 없으면 직접 docker run
          if [ -f docker-compose.yml ]; then
            echo "Deploying with docker-compose..."
            docker-compose pull
            docker-compose up -d
          else
            echo "Deploying with docker run..."
            # docker-compose가 없는 경우 직접 실행
            docker run -d \
              --name spring-app \
              --network bridge \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="${SPRING_DATASOURCE_URL}" \
              -e SPRING_DATASOURCE_USERNAME="${SPRING_DATASOURCE_USERNAME}" \
              -e SPRING_DATASOURCE_PASSWORD="${SPRING_DATASOURCE_PASSWORD}" \
              -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
              -e GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
              -e KAKAO_CLIENT_ID="${KAKAO_CLIENT_ID}" \
              -e KAKAO_CLIENT_SECRET="${KAKAO_CLIENT_SECRET}" \
              -e NAVER_CLIENT_ID="${NAVER_CLIENT_ID}" \
              -e NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET}" \
              -e MFDS_SERVICE_KEY="${MFDS_SERVICE_KEY}" \
              -e SPRING_PROFILES_ACTIVE=prod \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          fi

      - name: Wait for container to start
        run: |
          echo "Waiting for container to start..."
          sleep 5

      - name: Verify deployment
        run: |
          echo "=== 배포 검증 ==="
          echo "컨테이너 상태:"
          docker ps | grep spring-app || echo "컨테이너가 실행 중이 아닙니다"
          echo ""
          echo "최근 로그:"
          docker logs --tail 50 spring-app || echo "로그를 가져올 수 없습니다"
